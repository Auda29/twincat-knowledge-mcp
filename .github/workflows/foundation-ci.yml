name: Foundation CI

on:
  push:
    branches: [main, 'swarm/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_packages:
        description: 'Upload verified software packages (requires storage quota)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.12', '3.13']
    env:
      UV_LINK_MODE: copy
      UV_NO_PROGRESS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.1'
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --dev --python ${{ matrix.python }}
      - name: Record runtime
        run: uv run --frozen python --version
      - name: Lint
        run: uv run --frozen ruff check src tests
      - name: Check formatting
        run: uv run --frozen ruff format --check src tests
      - name: Type check
        run: uv run --frozen mypy
      - name: Check dependency compatibility
        run: uv pip check
      - name: Unit and installed-artifact tests
        run: uv run --frozen python -m pytest -q tests
      - name: Build wheel and source archive
        run: uv build
      - name: Hash software artifacts
        run: >-
          uv run --frozen python -c "import hashlib,pathlib;
          d=pathlib.Path('dist');
          files=sorted([*d.glob('*.whl'),*d.glob('*.tar.gz')]);
          assert len(files)==2;
          (d/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files),encoding='utf-8')"
      - name: Upload private CI build (not a release)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_packages == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
