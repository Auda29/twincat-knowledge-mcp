[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "twincat-knowledge"
version = "0.1.0"
description = "Data-source-neutral foundation for the TwinCAT Knowledge CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.2.0",
  "pydantic>=2.13.5,<3",
]

[project.scripts]
twincat-knowledge = "twincat_knowledge.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/twincat_knowledge"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
